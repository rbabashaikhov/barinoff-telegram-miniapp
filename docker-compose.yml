services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      API_PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:5173}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ALLOW_DEMO_MODE: ${ALLOW_DEMO_MODE:-true}
      DATABASE_PATH: /app/data/booking.db
      TZ: ${TZ:-Europe/Moscow}
      BUSINESS_NAME: ${BUSINESS_NAME:-BARINOFF}
      BUSINESS_TYPE: ${BUSINESS_TYPE:-барбершоп}
      APP_TITLE: ${APP_TITLE:-Барбершоп Barinoff}
      APP_DESCRIPTION: ${APP_DESCRIPTION:-Мы просто стрижём мужчин и делаем это превосходно.}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      FEATURE_DEMO_TOUR: ${FEATURE_DEMO_TOUR:-true}
      FEATURE_DEMO_ADMIN_PREVIEW: ${FEATURE_DEMO_ADMIN_PREVIEW:-true}
      CRM_ADAPTER: ${CRM_ADAPTER:-local}
      CRM_WEBHOOK_URL: ${CRM_WEBHOOK_URL:-}
      CRM_WEBHOOK_SECRET: ${CRM_WEBHOOK_SECRET:-}
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty = same-origin /api via nginx proxy (recommended for Docker)
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite_data:
